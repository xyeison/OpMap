name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  check:
    name: typecheck · lint · pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      GOOGLE_ROUTES_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas sin red (Supabase falso, sin Google)
        run: npm run test
